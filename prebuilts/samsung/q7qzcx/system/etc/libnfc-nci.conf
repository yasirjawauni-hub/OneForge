########################## Start of libnfc-nci.conf ###########################

###############################################################################
# Debug
# 0 = disabled, 1 = enabled
# Override via env: NFC_DEBUG_ENABLED
NFC_DEBUG_ENABLED=0

###############################################################################
# Storage
NFA_STORAGE="/data/nfc"

###############################################################################
# Poll duration (ms)
# Shorter = faster detection, higher battery use
# Recommended: 500 (balanced) | 750 (stable) | 1050 (legacy/slow tags)
NFA_DM_DISC_DURATION_POLL=500

###############################################################################
# UICC listen technology mask
# Bit flags (OR'd):
#   0x01 = NFC-A  0x02 = NFC-B  0x04 = NFC-F
# 0x07 = A+B+F (all standard techs)
UICC_LISTEN_TECH_MASK=0x07

###############################################################################
# Polling technology mask
# Bit flags:
#   0x01 = NFC-A
#   0x02 = NFC-B
#   0x04 = NFC-F
#   0x08 = ISO15693
#   0x20 = KOVIO
#   0x40 = NFC-A Active
#   0x80 = NFC-F Active
# 0xFF = all technologies (maximum compatibility across all devices/tags)
POLLING_TECH_MASK=0xFF

###############################################################################
# Preserve NFC storage across resets
# 0x00 = clear on reset | 0x01 = preserve
PRESERVE_STORAGE=0x01

###############################################################################
# Max EE (Execution Environments) supported
# Match to your NFC chip:
#   PN557        = 0x04
#   SN1xx/2xx/3xx = 0x06
NFA_MAX_EE_SUPPORTED=0x06

###############################################################################
# AID matching mode
# 0x00 = Exact only
# 0x01 = Exact or prefix
# 0x02 = Prefix only
# 0x03 = Exact, subset, or prefix (most permissive — best compatibility)
AID_MATCHING_MODE=0x03

###############################################################################
# NCI reset behaviour
# 0x00 = reset config every boot (safest for debugging)
# 0x01 = reset config once per boot
# 0x02 = keep config across boots (best performance)
NCI_RESET_TYPE=0x02

###############################################################################
# AID block routing
# 0x00 = disabled | 0x01 = enabled
NFA_AID_BLOCK_ROUTE=0x01

###############################################################################
# Off-host AID route power state
# 0x3B = all power states supported (screen on/off, battery low)
OFFHOST_AID_ROUTE_PWR_STATE=0x3B

###############################################################################
# Max WTX (Waiting Time eXtension) requests
# Higher = more tolerant of slow secure elements
# Recommended: 30 (standard) | 60 (tolerant)
NXP_WM_MAX_WTX_COUNT=30

###############################################################################
# Default Felica T3T system code
# FE:FE = wildcard (matches all Felica tags)
DEFAULT_SYS_CODE={FE:FE}

###############################################################################
# NCI credit notification timeout (seconds)
# Lower = faster error recovery
NXP_NCI_CREDIT_NTF_TIMEOUT=2

###############################################################################
# Presence check retry count (0–5)
# 0 = no retries (fastest disconnect detection)
# 3 = balanced (reduces false disconnects on slow tags)
PRESENCE_CHECK_RETRY_COUNT=2

###############################################################################
# T4T NDEF NFCEE AID
T4T_NDEF_NFCEE_AID={F4:10:00:00:09:4E:46:43:54:41:47:49:4E:46:4F}

###############################################################################
# Route ID for T4T NDEF NFCEE in routing table
# 0x00 = Host  | 0x01 = eSE  | 0x10 = UICC1  | 0x11 = UICC2
DEFAULT_NDEF_NFCEE_ROUTE=0x10

###############################################################################
# Host listen technology mask
# 0x00 = disabled
# 0x01 = ISO-DEP A
# 0x02 = ISO-DEP B
# 0x04 = T3T (NFC-F)
# 0x07 = all (A + B + F) — maximum compatibility
HOST_LISTEN_TECH_MASK=0x07

###############################################################################
# Skip ISO15693 GET_SYS_INFO command
# 0 = send command (standard)
# 1 = skip (use for NFC Forum certification tools)
ISO15693_SKIP_GET_SYS_INFO_CMD=0

###############################################################################
# Screen-off power state
# 0 = power-off sleep (best battery)
# 1 = full power (fastest wake)
# 2 = screen-off card emulation (CE1/CE3/CE4)
SCREEN_OFF_POWER_STATE=2

###############################################################################
# Mute tech routing
# 0x00 = route mute techs to DH, enable block bit, power state 0x00
# 0x01 = remove mute techs from RF discover (cleaner routing table)
MUTE_TECH_ROUTE_OPTION=0x01

###############################################################################
# Always-on SE power and link config
# Applied when always-on is active / inactive
ALWAYS_ON_SET_EE_POWER_AND_LINK_CONF=0x03
DISABLE_ALWAYS_ON_SET_EE_POWER_AND_LINK_CONF=0x01

###############################################################################
# eUICC MEP (Multiple Enabled Profiles) mode
# 0x00 = none  0x01 = MEP-A1  0x02 = MEP-A2  0x03 = MEP-B
EUICC_MEP_MODE=0x01

########################### End of libnfc-nci.conf ############################
