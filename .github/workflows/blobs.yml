name: Update prebuilt blobs

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device path filter (e.g. a26xxx). Leave blank for all."
        required: false
        default: ""
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Discover all device paths under prebuilts/samsung/ at runtime.
  # This means adding a new device folder is all that's ever needed — no YAML
  # matrix edits required.
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: prebuilts/samsung
          fetch-depth: 1

      - name: Scan device directories
        id: scan
        env:
          DEVICE_FILTER: ${{ github.event.inputs.device }}
        run: |
          ENTRIES="[]"
          for dir in prebuilts/samsung/*/; do
            [ -d "$dir" ] || continue
            path="${dir%/}"                          # strip trailing slash
            codename="$(basename "$path")"

            # Apply optional device filter from workflow_dispatch input
            if [ -n "$DEVICE_FILTER" ] && [ "$codename" != "$DEVICE_FILTER" ]; then
              continue
            fi

            ENTRIES=$(echo "$ENTRIES" | jq --arg p "$path" --arg c "$codename" \
              '. += [{"path": $p, "codename": $c}]')
          done

          echo "matrix=$(echo "$ENTRIES" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "Discovered devices:"
          echo "$ENTRIES" | jq -r '.[].path'

  # ---------------------------------------------------------------------------
  # Job 2 — Run one update job per discovered device.
  # ---------------------------------------------------------------------------
  update:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: "compiler_cmake"

      - name: Set up build environment
        env:
          PLATFORM_KEY_PK8: ${{ secrets.PLATFORM_KEY_PK8 }}
          PLATFORM_KEY_PEM: ${{ secrets.PLATFORM_KEY_PEM }}
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq --no-install-recommends \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$PLATFORM_KEY_PK8" | base64 --decode > security/extremerom_platform.pk8
          echo "$PLATFORM_KEY_PEM" | base64 --decode > security/extremerom_platform.x509.pem

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go
            ~/.ccache
          key: build-deps-${{ runner.os }}-${{ hashFiles('scripts/build_dependencies.sh') }}
          restore-keys: |
            build-deps-${{ runner.os }}-

      - name: Build dependencies
        run: |
          source ./buildenv.sh z3s
          ./scripts/build_dependencies.sh

      - name: Update prebuilt blobs
        run: |
          source ./buildenv.sh z3s
          ./scripts/internal/update_prebuilt_blobs.sh ${{ matrix.path }}
          echo "PDA_BUILD=$(cat ./${{ matrix.path }}/.current | cut -d '/' -f 1)" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MY_PAT }}
          add-paths: |
            ${{ matrix.path }}
          commit-message: "${{ matrix.path }}: update blobs to ${{ env.PDA_BUILD }}"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: "update/${{ matrix.codename }}"
          delete-branch: true
          title: "[${{ matrix.codename }}] Update blobs to ${{ env.PDA_BUILD }}"
          body: |
            Automated blob update for `${{ matrix.path }}`.

            | Field | Value |
            |---|---|
            | Device | `${{ matrix.codename }}` |
            | Build | `${{ env.PDA_BUILD }}` |
            | Triggered by | `${{ github.event_name }}` |
